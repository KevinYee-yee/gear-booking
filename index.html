<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>攝影器材管理與預約</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaed; --sub:#9aa2b1; --accent:#c9a86a; --accent2:#e8c987;
    --green:#4caf7f; --red:#e5674f; --amber:#e0a83a; --blue:#5b8def;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px 120px}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .hd{max-width:1080px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
  .logo{font-weight:700;font-size:18px;letter-spacing:.3px}
  .logo b{color:var(--accent)}
  .spacer{flex:1}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .tab{padding:7px 14px;border-radius:999px;font-size:14px;color:var(--sub);cursor:pointer;border:none;background:none;font-family:inherit}
  .tab.on{background:var(--accent);color:#1a1400;font-weight:600}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:9px 15px;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s}
  .btn:hover{border-color:var(--accent)}
  .btn.pri{background:var(--accent);color:#1a1400;border-color:var(--accent);font-weight:600}
  .btn.pri:hover{background:var(--accent2)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.gd{color:var(--green);border-color:#2e4a3d}
  .btn.rd{color:var(--red);border-color:#4a2e2e}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 12px}
  input,select,textarea{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  input:disabled{opacity:.55;cursor:not-allowed}
  .search{flex:1;min-width:180px}
  .vtoggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .vtoggle button{background:var(--panel);border:none;color:var(--sub);padding:9px 13px;cursor:pointer;font-family:inherit;font-size:14px}
  .vtoggle button.on{background:var(--accent);color:#1a1400;font-weight:600}

  .pill-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}

  /* 首次使用引導 */
  .onboard{background:linear-gradient(135deg,#20241a,#171a21);border:1px solid var(--line);border-radius:12px;padding:14px 40px 14px 16px;margin:16px 0;position:relative}
  .obclose{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--sub);font-size:15px;cursor:pointer}
  .obsteps{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .obstep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt)}
  .obnum{background:var(--accent);color:#1a1400;font-weight:700;font-size:12px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .obarrow{color:var(--sub)}

  /* 快速組合包 */
  .bwrap{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;margin-bottom:8px}
  .bcard{background:linear-gradient(160deg,#241f14,var(--panel));border:1px solid #4a3d20;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;flex:0 1 280px;min-width:240px;max-width:340px}
  .bt{font-weight:700;font-size:15px}
  .bthumbs{display:flex;gap:6px;cursor:pointer}
  .bthumb{border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex:0 0 auto}
  .bthumb img{width:100%;height:100%;object-fit:contain;padding:3px}
  .bthumb.bmore{background:var(--panel2);color:var(--sub);font-size:14px;font-weight:700}
  .bpreviewlink{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);cursor:pointer;font-weight:600}
  .bpreviewgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;background:var(--panel2);border-radius:10px;padding:12px;margin:2px 0}
  .bpitem{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
  .bpname{font-size:11.5px;color:var(--sub);line-height:1.3}
  .fchip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--sub);cursor:pointer;font-size:13px}
  .fchip.on{border-color:var(--accent);color:var(--accent)}

  /* card view — 大圖在上，像電商卡片 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
  .cphoto{width:100%;aspect-ratio:4/3;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden;position:relative;text-align:center}
  .cphoto img{width:100%;height:100%;object-fit:contain;padding:8px}
  .cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card h3{margin:0;font-size:16px;font-weight:700;line-height:1.35}
  .cardtop{display:flex;align-items:flex-start;gap:12px}
  .cardtop h3{flex:1;min-width:0}
  .cardmeta1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .lico{font-size:18px;width:22px;text-align:center;flex:0 0 auto}
  .cattag{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .accbadge{font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap}
  .photozone{border:1px dashed var(--line);border-radius:10px;min-height:90px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:var(--panel2)}
  .photozone:hover{border-color:var(--accent)}
  .photohint{color:var(--sub);font-size:13px;text-align:center;padding:16px;line-height:1.7}
  .photoprev{max-width:100%;max-height:180px;object-fit:contain;display:block}
  .acclist{display:flex;flex-direction:column;gap:6px;margin-top:4px;background:var(--panel2);border-radius:8px;padding:8px 10px}
  .accitem{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
  .accitem input{width:16px;height:16px;accent-color:var(--accent)}
  .meta{font-size:13px;color:var(--sub);line-height:1.5}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .b-ok{background:#16351f;color:#6ee7a0}.b-out{background:#3a2a12;color:#e0a83a}
  .b-fix{background:#2a2f3a;color:#9aa2b1}.b-dead{background:#3a1f1f;color:#e5674f}
  .b-wait{background:#22304a;color:#8ab4ff}.b-appr{background:#16351f;color:#6ee7a0}
  .b-rej{background:#3a1f1f;color:#e5674f}.b-ret{background:#2a2f3a;color:#9aa2b1}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

  /* list view */
  .lst{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
  .lst .lrow:first-child{border-top:none}
  .lrow .nm{flex:1;min-width:0}
  .lrow .nm .t{font-weight:600;font-size:15px}
  .lrow.sub{background:var(--panel2);padding-left:38px}
  .caret{width:20px;text-align:center;color:var(--sub);cursor:pointer;user-select:none;transition:.15s}
  .caret.open{transform:rotate(90deg)}
  .cat-tag{font-size:12px;color:var(--sub);background:var(--panel2);padding:2px 8px;border-radius:6px}

  .grpline{display:flex;align-items:center;gap:8px;cursor:pointer}
  .variants{display:flex;flex-direction:column;gap:8px;margin-top:8px;border-top:1px dashed var(--line);padding-top:10px}
  .vrow{display:flex;align-items:center;gap:10px}
  .vrow .vn{flex:1;font-size:14px}
  .vrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
  .cbspace{width:18px;flex:0 0 auto}
  .selbar{justify-content:flex-end;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}

  .rowlist{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .item .grow{flex:1;min-width:180px}
  .item .t{font-weight:600}
  .empty{text-align:center;color:var(--sub);padding:60px 0}
  .sec-title{font-size:15px;color:var(--sub);margin:26px 0 12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
  .count{background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:4px}

  /* qty stepper */
  .step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .step button{background:var(--panel2);border:none;color:var(--txt);width:30px;height:30px;font-size:16px;cursor:pointer}
  .step button:disabled{opacity:.35;cursor:not-allowed}
  .step .qv{min-width:34px;text-align:center;font-size:14px}

  /* cart FAB */
  .fab{position:fixed;right:20px;bottom:20px;z-index:40;background:var(--accent);color:#1a1400;border:none;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;font-family:inherit}
  .fab .cbadge{background:#1a1400;color:var(--accent2);border-radius:999px;padding:1px 8px;font-size:13px}
  .fab.hide{display:none}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .overlay.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:22px}
  .modal h2{margin:0 0 4px;font-size:19px}
  .modal .sub{color:var(--sub);font-size:13px;margin-bottom:16px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dtrow{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
  .editexit{font-size:12px;color:var(--red);cursor:pointer;margin:-6px 0 12px;font-weight:600}
  .dtrow input{color-scheme:dark}
  .modal .actions{display:flex;gap:10px;margin-top:18px}
  .modal .actions .btn{flex:1;justify-content:center;text-align:center}
  .bmpicklist{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px 12px}
  .bmgrouphead{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;padding:8px 0 4px;border-top:1px solid var(--line);margin-top:2px}
  .bmgrouphead:first-child{border-top:none;margin-top:0}
  .bmrow{display:flex;align-items:center;gap:10px;padding:6px 0}
  .bmrow label{flex:1;font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer}
  .bmrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
  .bmrow input[type=number]{width:56px;padding:5px 6px}

  .citem{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
  .citem:first-child{border-top:none}
  .citemtop{display:flex;align-items:center;gap:10px}
  .citem .cn{flex:1;font-size:14px}
  .cbundle{background:linear-gradient(160deg,#241f14,transparent);margin:0 -4px;padding:10px 4px;border-radius:10px}
  .cbundleitems{margin-top:6px;padding-left:8px;border-left:2px solid #4a3d20;display:flex;flex-direction:column}
  .cbundleitems .citem{border-top:1px dashed var(--line);padding:8px 0}
  .cbundleitems .citem:first-child{border-top:none}
  .citem .rm{color:var(--red);cursor:pointer;border:none;background:none;font-size:16px}

  /* 行事曆 */
  .calnav{display:flex;align-items:center;gap:10px;margin:2px 0 12px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
  .callegend .lg{display:inline-block;width:14px;height:11px;border-radius:3px;vertical-align:middle;margin:0 3px}
  .lg.appr{background:var(--accent)}.lg.pend{border:1px dashed var(--amber)}
  .calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .calgrid{min-width:max-content}
  .calrow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
  .calheadrow{border-top:none;position:sticky;top:0;z-index:3}
  .calname{position:sticky;left:0;z-index:2;background:var(--panel);display:flex;align-items:center;padding:0 10px;border-right:1px solid var(--line);font-size:13px;font-weight:600;flex:0 0 auto}
  .calhcell{background:var(--panel2)}
  .calday{flex:0 0 auto;text-align:center;font-size:11px;color:var(--sub);border-right:1px solid var(--line);padding:5px 0;display:flex;flex-direction:column;justify-content:center;background:var(--panel2)}
  .calday.wend{color:#c98a8a}
  .calday.tdy{background:#2a2412;color:var(--accent2)}
  .caltrack{position:relative;flex:0 0 auto}
  .cbar{position:absolute;height:20px;border-radius:5px;font-size:11px;color:#1a1400;display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;cursor:default}
  .cbar.appr{background:var(--accent)}
  .cbar.pend{background:transparent;border:1px dashed var(--amber);color:var(--amber)}
  .caltoday{position:absolute;top:0;bottom:0;background:rgba(201,168,106,.10);pointer-events:none}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:12px 20px;border-radius:12px;z-index:100;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
  .toast.on{opacity:1}.toast.err{border-color:var(--red)}.toast.ok{border-color:var(--green)}
  .loading{text-align:center;padding:60px;color:var(--sub)}
  .hide{display:none!important}
</style>

<header>
  <div class="hd">
    <div class="logo">📷 器材<b>管理</b></div>
    <div class="spacer"></div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-view="inventory">器材庫存</button>
      <button class="tab" data-view="myresv">預約查詢</button>
      <button class="tab" data-view="admin">管理端</button>
    </div>
  </div>
</header>

<div class="wrap"><div id="app"><div class="loading">載入中…</div></div></div>

<button class="fab hide" id="cartFab" onclick="openCart()">🛒 借用清單 <span class="cbadge" id="cartCount">0</span></button>

<!-- 結帳 modal -->
<div class="overlay" id="cartModal">
  <div class="modal">
    <h2 id="ckTitle">借用清單</h2>
    <div class="sub" id="ckSub">選好器材與數量，最後填一次借用資料送出</div>
    <div class="editexit hide" id="ckExitEdit" onclick="exitEditMode()">✕ 取消調整，清空並返回一般借用</div>
    <div id="cartItems"></div>
    <div class="field" style="margin-top:16px"><label>借出時間 *</label>
      <div class="dtrow"><input type="date" id="ckStartDate"><input type="time" id="ckStartTime"></div></div>
    <div class="field"><label>歸還時間 *</label>
      <div class="dtrow"><input type="date" id="ckEndDate"><input type="time" id="ckEndTime"></div></div>
    <div class="row2">
      <div class="field"><label>借用人 *</label><input id="ckName" placeholder="姓名"></div>
      <div class="field"><label>部門 *</label><input id="ckDept" placeholder="所屬部門"></div>
    </div>
    <div class="field"><label>Email（接收核准/拒絕通知）*</label><input type="email" id="ckMail" placeholder="you@company.com"></div>
    <div class="field"><label>專案 / 用途名稱（會成為卡片標題）</label><input id="ckPurpose" placeholder="例：8月產品拍攝"></div>
    <div class="field"><label>使用地點 *</label><input id="ckLocation" placeholder="例：公司棚內 / 台北市信義區戶外"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal('cartModal')">繼續挑選</button>
      <button class="btn pri" id="ckSubmit">送出申請</button>
    </div>
  </div>
</div>

<!-- PIN modal -->
<div class="overlay" id="pinModal">
  <div class="modal" style="max-width:340px">
    <h2>管理端登入</h2><div class="sub">輸入管理員 PIN</div>
    <div class="field"><input type="password" id="pinInput" placeholder="PIN"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal('pinModal')">取消</button>
      <button class="btn pri" id="pinSubmit">進入</button>
    </div>
  </div>
</div>

<!-- 器材編輯 modal -->
<div class="overlay" id="equipModal">
  <div class="modal">
    <h2 id="emTitle">新增器材</h2>
    <div class="field"><label>名稱 *</label><input id="emName"></div>
    <div class="row2">
      <div class="field"><label>分類（選擇或輸入新的）</label>
        <input id="emCat" list="catList" placeholder="選擇或輸入新分類"><datalist id="catList"></datalist></div>
      <div class="field"><label>型號</label><input id="emModel"></div>
    </div>
    <div class="row2">
      <div class="field"><label>群組（選填，同群組會收合，例：記憶卡）</label>
        <input id="emGroup" list="grpList" placeholder="留空＝獨立"><datalist id="grpList"></datalist></div>
      <div class="field"><label>庫存數量</label><input type="number" id="emQty" min="1" value="1"></div>
    </div>
    <div class="row2">
      <div class="field"><label>序號</label><input id="emSerial"></div>
      <div class="field"><label>狀態</label><select id="emStatus"><option>可借用</option><option>維修中</option><option>報廢</option></select></div>
    </div>
    <div class="field"><label>照片（點下方選檔，或直接 ⌘/Ctrl+V 貼上截圖）</label>
      <div class="photozone" id="emPhotoZone">
        <img id="emPhotoPrev" class="photoprev hide" alt="">
        <div class="photohint" id="emPhotoHint">📷 點此選圖片檔<br>或直接貼上截圖（⌘/Ctrl+V）</div>
      </div>
      <input type="file" id="emFile" accept="image/*" class="hide">
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="emPhoto" placeholder="或貼圖片網址 https://…" style="flex:1" oninput="updatePhotoPreview()">
        <button type="button" class="btn sm" onclick="clearPhoto()">清除</button>
      </div>
    </div>
    <div class="field"><label>備註（純文字說明）</label><input id="emNote" placeholder="例：油壓雲台、公司主力機身…"></div>
    <div class="field"><label>附帶器材（一行一項，或用「、」分隔；借還可勾選清點）</label>
      <textarea id="emAcc" rows="3" placeholder="機身&#10;電池 ×5&#10;充電器 ×3&#10;相機袋"></textarea></div>
    <div class="actions">
      <button class="btn rd" id="emDelete" style="flex:0 0 auto">刪除</button>
      <button class="btn" onclick="closeModal('equipModal')">取消</button>
      <button class="btn pri" id="emSave">儲存</button>
    </div>
  </div>
</div>

<!-- 組合包編輯 modal -->
<div class="overlay" id="bundleModal">
  <div class="modal">
    <h2 id="bmTitle">新增組合</h2>
    <div class="field"><label>名稱 *</label><input id="bmName" placeholder="例：基礎攝影組"></div>
    <div class="field"><label>說明</label><input id="bmDesc" placeholder="給非攝影背景同事看的簡短說明"></div>
    <div class="field"><label>狀態</label><select id="bmStatus"><option>啟用</option><option>停用</option></select></div>
    <div class="field"><label>選擇器材與數量</label>
      <div class="bmpicklist" id="bmPickList"></div>
    </div>
    <div class="actions">
      <button class="btn rd" id="bmDelete" style="flex:0 0 auto">刪除</button>
      <button class="btn" onclick="closeModal('bundleModal')">取消</button>
      <button class="btn pri" id="bmSave">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = localStorage.getItem('gear_api') ||
  'https://script.google.com/macros/s/AKfycbzXdWHMQ9p7bKmtxaXU9NMnUT1kt6_yVFTmqCsnBsgFiipZjCBGovrnwkufCebUtkYA/exec';

let DATA={equipment:[],reservations:[],bundles:[]};
let VIEW='inventory';
let ADMIN_PIN=sessionStorage.getItem('gear_pin')||'';
let filterCat='全部', searchQ='';
let sortMode=localStorage.getItem('gear_sort')||'default'; // default | freq_desc | freq_asc | name_asc | name_desc
let viewMode=localStorage.getItem('gear_viewmode')||'card';
let expanded={};           // 器材群組展開狀態
let expandedResv={};       // 預約專案卡展開狀態
let adGroups=[], myGroups=[]; // 目前渲染的預約分組（管理端 / 查詢）
let expandedAcc={};        // 器材「附帶清單」展開狀態
let adminCat='全部';       // 管理端器材清單的分類篩選
let editBundleId=null, bundleSel={};  // 組合包編輯：id、勾選的器材({id:數量})
let cartBundleExpanded={};            // 購物車內組合包展開狀態
let expandedBundle={};                // 庫存頁「快速組合」預覽展開狀態
let editMode=null;  // 調整已送出專案時：{oldIds,借用人,部門,聯絡方式,用途,借出日,歸還日}；純記憶體，重整頁面就自動退出，不會卡住
let savedCart=null; // 進入調整模式時暫存的「真正待送出」購物車，調整期間不受影響，離開/完成後還原
let cart=JSON.parse(localStorage.getItem('gear_cart')||'{}');  // 器材id -> {id,名稱,數量,stock}；存 localStorage 重整不消失
let editEquipId=null;

const todayStr=()=>new Date().toISOString().slice(0,10);
const pad2=n=>String(n).padStart(2,'0');
const nowStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());};
const addDays=(ds,n)=>{const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
let calStart=todayStr();

async function api(action,params={},isPost=false){
  if(isPost){
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...params})});
    return res.json();
  }
  const q=new URLSearchParams({action,...params});
  const res=await fetch(API_URL+'?'+q.toString());
  return res.json();
}

async function load(){
  try{
    const r=await api('list');
    if(!r.ok) throw new Error(r.error||'讀取失敗');
    DATA=r; borrowCountCache=null; reconcileCart(); render();
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="empty">⚠️ ${e.message}</div>`;
  }
}

// ---- 目前（此刻）已借出的份數 ----
function usedNow(id){
  const now=nowStr(); let u=0;
  DATA.reservations.forEach(r=>{
    if(r['器材id']===id && r['狀態']==='已核准' && String(r['借出日'])<=now && now<=String(r['歸還日']))
      u+=(Number(r['數量'])||1);
  });
  return u;
}
function liveBadge(eq){
  if(eq['狀態']!=='可借用') return badge(eq['狀態']);
  const stock=Number(eq['數量'])||1;
  const free=Math.max(0,stock-usedNow(eq.id));
  if(stock===1) return free>0?badge('可借用'):badge('借出中');
  return `<span class="badge ${free>0?'b-ok':'b-out'}"><span class="dot"></span>現可借 ${free}/${stock}</span>`;
}
function badge(s){
  const m={'可借用':'b-ok','借出中':'b-out','維修中':'b-fix','報廢':'b-dead','待審核':'b-wait','已核准':'b-appr','已拒絕':'b-rej','已歸還':'b-ret','已取消':'b-ret'};
  return `<span class="badge ${m[s]||'b-fix'}"><span class="dot"></span>${s}</span>`;
}
const bookable=eq=>eq['狀態']==='可借用';

// ---- 借用次數（依已核准/已歸還的預約統計，愈常借愈熱門）----
let borrowCountCache=null;
function borrowCount(id){
  if(!borrowCountCache){
    borrowCountCache={};
    DATA.reservations.forEach(r=>{
      if(r['狀態']==='已核准'||r['狀態']==='已歸還') borrowCountCache[r['器材id']]=(borrowCountCache[r['器材id']]||0)+1;
    });
  }
  return borrowCountCache[id]||0;
}
function sortItems(items){
  const arr=[...items];
  if(sortMode==='name_asc') arr.sort((a,b)=>String(a['名稱']).localeCompare(String(b['名稱']),'zh-Hant'));
  else if(sortMode==='name_desc') arr.sort((a,b)=>String(b['名稱']).localeCompare(String(a['名稱']),'zh-Hant'));
  else if(sortMode==='freq_desc') arr.sort((a,b)=>borrowCount(b.id)-borrowCount(a.id));
  else if(sortMode==='freq_asc') arr.sort((a,b)=>borrowCount(a.id)-borrowCount(b.id));
  return arr;
}
function setSort(v){sortMode=v;localStorage.setItem('gear_sort',v);render();}

// ---- 分類配色 + 配圖 ----
const CATMETA={
  '相機':{c:'#5b8def',e:'📷'},'鏡頭':{c:'#7c6cf0',e:'🔭'},'燈光':{c:'#e0a83a',e:'💡'},
  '音訊':{c:'#e5674f',e:'🎙️'},'儲存':{c:'#4caf7f',e:'💾'},'電源':{c:'#e08a3a',e:'🔋'},
  '腳架':{c:'#8a94a6',e:'🦵'},'穩定器':{c:'#48b1c9',e:'🎚️'},'配件':{c:'#b07cc9',e:'🧰'},'雜項':{c:'#9aa2b1',e:'📦'}
};
const catStyle=cat=>CATMETA[cat]||{c:'#9aa2b1',e:'📦'};
const catTag=cat=>{const s=catStyle(cat);return `<span class="cattag" style="background:${s.c}22;color:${s.c}">${s.e} ${cat||'—'}</span>`;};

// ---- 附帶器材清單（可勾選清點）----
const accList=s=>String(s||'').split(/[、\n,，]/).map(x=>x.trim()).filter(Boolean);
const accCount=e=>accList(e['附帶']).length;
const accBadge=e=>accCount(e)?`<span class="accbadge">📋 ${accCount(e)} 件配件 ${expandedAcc[e.id]?'▲':'▾'}</span>`:'';
function toggleAcc(id){expandedAcc[id]=!expandedAcc[id];render();}
function accChecklist(e){
  const items=accList(e['附帶']); if(!items.length) return '';
  return `<div class="acclist">${items.map(it=>`<label class="accitem"><input type="checkbox" checked>${it}</label>`).join('')}</div>`;
}

// ---- 分群 ----
function buildUnits(items){
  const groups={}, units=[];
  items.forEach(e=>{
    if(e['群組']){
      if(!groups[e['群組']]){ groups[e['群組']]={type:'group',name:e['群組'],cat:e['分類'],items:[]}; units.push(groups[e['群組']]); }
      groups[e['群組']].items.push(e);
    }else units.push({type:'single',item:e});
  });
  return units;
}

// ---- 預約分組：同「專案名稱」歸成一個父資料夾（無名稱者退回批次/單筆）----
function groupResv(list){
  const g={}, order=[];
  list.forEach(r=>{
    const name=(r['用途']||'').trim();
    const key=name?('P:'+name):('B:'+(r['批次']||r['id']));
    if(!g[key]){g[key]={key,用途:r['用途'],借用人:r['借用人'],部門:r['部門'],聯絡方式:r['聯絡方式'],使用地點:r['使用地點'],借出日:r['借出日'],歸還日:r['歸還日'],items:[]};order.push(key);}
    const gg=g[key]; gg.items.push(r);
    if(String(r['借出日'])<String(gg.借出日)) gg.借出日=r['借出日'];   // 期間取涵蓋範圍
    if(String(r['歸還日'])>String(gg.歸還日)) gg.歸還日=r['歸還日'];
    if(r['借用人']!==gg.借用人) gg._multi=true;
  });
  return order.map(k=>g[k]);
}
function grpBorrower(g){return g._multi?'多位借用人':g['借用人'];}
function grpPending(g){return g.items.filter(i=>i['狀態']==='待審核');}
function statusSummary(items){
  const c={}; items.forEach(i=>c[i['狀態']]=(c[i['狀態']]||0)+1);
  return Object.keys(c).map(s=>`${c[s]} ${s}`).join('・');
}
function toggleResvIdx(idx,scope){const arr=scope==='ad'?adGroups:myGroups;const g=arr[idx];if(!g)return;const k=scope+'::'+g.key;expandedResv[k]=!expandedResv[k];render();}

// ---- 渲染 ----
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===VIEW));
  const app=document.getElementById('app');
  if(VIEW==='inventory') app.innerHTML=renderInventory();
  else if(VIEW==='myresv') app.innerHTML=renderMyResv();
  else app.innerHTML=renderAdmin();
  updateCart();
  const s=document.getElementById('searchBox');
  if(s) s.oninput=e=>{ searchQ=e.target.value; const p=e.target.selectionStart; render(); const n=document.getElementById('searchBox'); if(n){n.focus();n.setSelectionRange(p,p);} };
}

function renderInventory(){
  const cats=['全部',...new Set(DATA.equipment.map(e=>e['分類']).filter(Boolean))];
  const q=searchQ.toLowerCase();
  const items=DATA.equipment.filter(e=>{
    const okCat=filterCat==='全部'||e['分類']===filterCat;
    const okQ=!q||(e['名稱']+e['型號']+e['分類']+e['序號']+(e['群組']||'')+(e['備註']||'')+(e['附帶']||'')).toLowerCase().includes(q);
    return okCat&&okQ;
  });
  const sorted=sortItems(items);
  const units=buildUnits(sorted);
  const chips=cats.map(c=>{
    const on=c===filterCat, s=c==='全部'?{c:'var(--accent)',e:'🗂'}:catStyle(c);
    return `<div class="fchip ${on?'on':''}" style="${on?`border-color:${s.c};color:${s.c}`:''}" onclick="setCat('${c}')">${c==='全部'?'🗂 全部':s.e+' '+c}</div>`;
  }).join('');
  let body;
  if(!sorted.length) body=`<div class="empty">沒有符合的器材</div>`;
  else if(viewMode==='calendar') body=calendarView(sorted);
  else if(viewMode==='list') body=listView(units);
  else body=cardView(units);
  const sortOpts=[['default','預設順序'],['freq_desc','常借次數 ↓'],['freq_asc','常借次數 ↑'],['name_asc','字母 A→Z'],['name_desc','字母 Z→A']];
  return `
    ${onboardBanner()}
    ${bundleSection()}
    <div class="toolbar">
      <input class="search" id="searchBox" placeholder="搜尋名稱 / 型號 / 用途 / 配件…" value="${searchQ}">
      <select id="sortSel" onchange="setSort(this.value)">${sortOpts.map(([v,l])=>`<option value="${v}" ${sortMode===v?'selected':''}>${l}</option>`).join('')}</select>
      <div class="vtoggle">
        <button class="${viewMode==='card'?'on':''}" onclick="setView('card')">▦ 卡片</button>
        <button class="${viewMode==='list'?'on':''}" onclick="setView('list')">☰ 列表</button>
        <button class="${viewMode==='calendar'?'on':''}" onclick="setView('calendar')">📅 行事曆</button>
      </div>
    </div>
    <div class="pill-filter">${chips}</div>
    ${body}`;
}

// ---- 首次使用引導（一次性，關閉後不再顯示）----
function onboardBanner(){
  if(localStorage.getItem('gear_onboard_dismissed')) return '';
  return `<div class="onboard">
    <button class="obclose" onclick="dismissOnboard()">✕</button>
    <div class="obsteps">
      <div class="obstep"><span class="obnum">1</span>挑選器材，點「加入清單」</div>
      <div class="obarrow">→</div>
      <div class="obstep"><span class="obnum">2</span>填寫借用人／部門／Email 送出</div>
      <div class="obarrow">→</div>
      <div class="obstep"><span class="obnum">3</span>等待審核通過，即可依時段領取</div>
    </div>
  </div>`;
}
function dismissOnboard(){localStorage.setItem('gear_onboard_dismissed','1');render();}

// ---- 快速組合包 ----
function thumbTile(eq,size){
  const s=catStyle(eq['分類']);
  const inner=eq['照片網址']?`<img src="${eq['照片網址']}" alt="">`:s.e;
  return `<div class="bthumb" style="width:${size}px;height:${size}px;background:${s.c}22;color:${s.c}">${inner}</div>`;
}
function bundleSection(){
  const list=(DATA.bundles||[]).filter(b=>b['狀態']!=='停用');
  if(!list.length) return '';
  const MINOR_CATS=['電源','配件'];  // 這些歸為「小配件」，縮圖預覽只帶出大品項
  const CAT_ORDER=['相機','鏡頭','穩定器','燈光','音訊','腳架','儲存','電源','配件','雜項'];
  const catRank=cat=>{const i=CAT_ORDER.indexOf(cat);return i<0?CAT_ORDER.length:i;};
  const cards=list.map(b=>{
    let items=[]; try{items=JSON.parse(b['項目']||'[]');}catch(e){}
    const withEq=items.map(it=>({eq:DATA.equipment.find(x=>x.id===it['器材id']),qty:it['數量']})).filter(x=>x.eq)
      .sort((a,b)=>catRank(a.eq['分類'])-catRank(b.eq['分類'])); // 主要器材在前、小配件在後，順序才有邏輯
    const major=withEq.filter(x=>MINOR_CATS.indexOf(x.eq['分類'])<0);
    const shownThumbs=(major.length?major:withEq).slice(0,4);
    const restCount=withEq.length-shownThumbs.length;
    const thumbsHtml=shownThumbs.map(x=>thumbTile(x.eq,52)).join('')+(restCount>0?`<div class="bthumb bmore" style="width:52px;height:52px">+${restCount}</div>`:'');
    const open=expandedBundle[b.id];
    const fullGrid=withEq.map(x=>`
      <div class="bpitem">${thumbTile(x.eq,64)}<div class="bpname">${x.eq['名稱']}${x.qty>1?` <span class="meta">×${x.qty}</span>`:''}</div></div>`).join('');
    return `<div class="bcard">
      <div class="bt">🎁 ${b['名稱']}</div>
      ${b['說明']?`<div class="meta">${b['說明']}</div>`:''}
      <div class="bthumbs" onclick="toggleBundlePreview('${b.id}')">${thumbsHtml}</div>
      <div class="bpreviewlink" onclick="toggleBundlePreview('${b.id}')"><span class="caret ${open?'open':''}">▶</span>看看裡面有什麼（${withEq.length} 項）</div>
      ${open?`<div class="bpreviewgrid">${fullGrid}</div>`:''}
      <button class="btn pri sm" onclick="addBundleToCart('${b.id}','${b['名稱'].replace(/'/g,"\\'")}')">整組加入清單</button>
    </div>`;
  }).join('');
  return `<div class="sec-title" style="margin-top:4px">🎁 快速組合</div><div class="bwrap">${cards}</div>`;
}
function toggleBundlePreview(id){expandedBundle[id]=!expandedBundle[id];render();}
function addBundleToCart(id,bundleName){
  const b=(DATA.bundles||[]).find(x=>x.id===id); if(!b) return;
  bundleName=bundleName||b['名稱'];
  let items=[]; try{items=JSON.parse(b['項目']||'[]');}catch(e){}
  let added=0, skipped=[];
  items.forEach(it=>{
    const eq=DATA.equipment.find(x=>x.id===it['器材id']);
    if(!eq||eq['狀態']!=='可借用'){skipped.push(eq?eq['名稱']:it['器材id']);return;}
    const stock=Number(eq['數量'])||1, want=Number(it['數量'])||1;
    if(!cart[eq.id]) cart[eq.id]={id:eq.id,名稱:eq['名稱'],數量:0,stock};
    const next=cart[eq.id].數量+want;
    if(next>stock){cart[eq.id].數量=stock;skipped.push(eq['名稱']+'（庫存不足，已加到上限）');}
    else cart[eq.id].數量=next;
    cart[eq.id].fromBundle=id; cart[eq.id].bundleName=bundleName;  // 標記來自同一個組合，購物車會收成一包
    added++;
  });
  saveCart(); render();
  toast(skipped.length?`已加入，但 ${skipped.length} 項需注意：${skipped.join('；')}`:`已整組加入清單（${added} 項）`, skipped.length?'err':'ok');
}

function addBtn(eq){
  if(!bookable(eq)) return '';
  const inCart=cart[eq.id]?` (${cart[eq.id].數量})`:'';
  return `<button class="btn pri sm" onclick="addCart('${eq.id}')">加入清單${inCart}</button>`;
}

function cardView(units){
  return `<div class="grid">${units.map(u=>{
    if(u.type==='single'){
      const e=u.item, s=catStyle(e['分類']);
      const photo=e['照片網址']?`<img src="${e['照片網址']}" alt="">`:s.e;
      const hasAcc=accCount(e)>0;
      return `<div class="card">
        <div class="cphoto" style="background:${s.c}1c;color:${s.c}">${photo}</div>
        <div class="cbody">
          <div class="cardtop"><h3 ${hasAcc?`onclick="toggleAcc('${e.id}')" style="cursor:pointer"`:''}>${e['名稱']}</h3></div>
          <div class="cardmeta1">${liveBadge(e)}${catTag(e['分類'])}${e['型號']?`<span class="meta">${e['型號']}</span>`:''}${(Number(e['數量'])||1)>1?`<span class="meta">庫存 ${e['數量']}</span>`:''}${hasAcc?`<span onclick="toggleAcc('${e.id}')" style="cursor:pointer">${accBadge(e)}</span>`:''}</div>
          ${e['備註']?`<div class="meta">${e['備註']}</div>`:''}
          ${hasAcc&&expandedAcc[e.id]?accChecklist(e):''}
          <div style="flex:1"></div>${addBtn(e)}
        </div></div>`;
    }
    const open=expanded[u.name], s=catStyle(u.cat);
    return `<div class="card">
      <div class="cphoto" style="background:${s.c}1c;color:${s.c};cursor:pointer" onclick="toggleGroup('${u.name}')">${s.e}<span class="cat-tag" style="position:absolute;top:10px;right:10px">${u.items.length} 種</span></div>
      <div class="cbody">
        <div class="grpline" onclick="toggleGroup('${u.name}')">
          <span class="caret ${open?'open':''}">▶</span>
          <h3 style="flex:1">${u.name}</h3>
        </div>
        <div class="cardmeta1">${catTag(u.cat)}<span class="meta">點開選規格</span></div>
        ${open?`<div class="variants">${u.items.map(e=>`
          <div class="vrow"><span class="vn">${e['名稱']} ${liveBadge(e)}</span>${addBtn(e)}</div>`).join('')}</div>`:''}
      </div></div>`;
  }).join('')}</div>`;
}

function listView(units){
  let rows='';
  units.forEach(u=>{
    if(u.type==='single'){
      const e=u.item, s=catStyle(e['分類']);
      const hasAcc=accCount(e)>0;
      rows+=`<div class="lrow" style="box-shadow:inset 3px 0 0 ${s.c}"><span class="lico">${s.e}</span>
        <div class="nm" ${hasAcc?`onclick="toggleAcc('${e.id}')" style="cursor:pointer"`:''}><div class="t">${e['名稱']} ${accBadge(e)}</div><div class="meta">${e['備註']||''}</div></div>
        ${catTag(e['分類'])}${liveBadge(e)}${addBtn(e)}</div>`;
      if(hasAcc&&expandedAcc[e.id]) rows+=`<div class="lrow sub">${accChecklist(e)}</div>`;
    }else{
      const open=expanded[u.name], s=catStyle(u.cat);
      rows+=`<div class="lrow" style="box-shadow:inset 3px 0 0 ${s.c}"><span class="caret ${open?'open':''}" onclick="toggleGroup('${u.name}')">▶</span>
        <span class="lico">${s.e}</span>
        <div class="nm" onclick="toggleGroup('${u.name}')" style="cursor:pointer"><div class="t">${u.name}</div><div class="meta">${u.items.length} 種規格</div></div>
        ${catTag(u.cat)}</div>`;
      if(open) u.items.forEach(e=>{
        rows+=`<div class="lrow sub"><div class="nm"><div class="t" style="font-weight:500">${e['名稱']}</div></div>${liveBadge(e)}${addBtn(e)}</div>`;
      });
    }
  });
  return `<div class="lst">${rows}</div>`;
}

// ---- 行事曆（時間軸）----
function shiftCal(n){calStart=addDays(calStart,n);render();}
function calToday(){calStart=todayStr();render();}
function calendarView(items){
  const cellW=38, nameW=140, days=28;
  const startD=new Date(calStart+'T00:00:00');
  const idx=ds=>Math.round((new Date(String(ds).slice(0,10)+'T00:00:00')-startD)/86400000);
  const today=todayStr();
  const cols=[];
  for(let i=0;i<days;i++){
    const d=new Date(startD); d.setDate(d.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    cols.push({ds,num:d.getDate(),wd:d.getDay(),first:d.getDate()===1||i===0,month:d.getMonth()+1});
  }
  let head=`<div class="calname calhcell" style="width:${nameW}px">器材</div>`;
  cols.forEach(c=>{
    const cls=(c.wd===0||c.wd===6?'wend ':'')+(c.ds===today?'tdy':'');
    head+=`<div class="calday ${cls}" style="width:${cellW}px">${c.first?`<b>${c.month}月</b>`:'&nbsp;'}<span>${c.num}</span></div>`;
  });

  const ti=idx(today);
  const trackBg=`background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:${cellW}px 100%`;
  let rows='';
  items.forEach(e=>{
    const resv=DATA.reservations.filter(r=>r['器材id']===e.id && ['已核准','待審核'].includes(r['狀態']) && idx(r['歸還日'])>=0 && idx(r['借出日'])<=days-1);
    resv.sort((a,b)=>a['借出日']<b['借出日']?-1:1);
    const lanes=[];
    const placed=resv.map(r=>{
      const s=Math.max(0,idx(r['借出日'])), en=Math.min(days-1,idx(r['歸還日']));
      let lane=lanes.findIndex(le=>le<s);
      if(lane<0){lane=lanes.length;lanes.push(en);} else lanes[lane]=en;
      return {r,s,en,lane};
    });
    const rowH=Math.max(1,lanes.length)*24+8;
    let bars=(ti>=0&&ti<days)?`<div class="caltoday" style="left:${ti*cellW}px;width:${cellW}px"></div>`:'';
    placed.forEach(p=>{
      const ap=p.r['狀態']==='已核准';
      bars+=`<div class="cbar ${ap?'appr':'pend'}" style="left:${p.s*cellW+2}px;top:${p.lane*24+4}px;width:${(p.en-p.s+1)*cellW-4}px" title="${p.r['借用人']}／${p.r['部門']}　${p.r['借出日']}~${p.r['歸還日']}　×${Number(p.r['數量'])||1}　${p.r['狀態']}">${p.r['借用人']||''}${(Number(p.r['數量'])||1)>1?' ×'+p.r['數量']:''}</div>`;
    });
    rows+=`<div class="calrow" style="height:${rowH}px">
      <div class="calname" style="width:${nameW}px">${e['名稱']}</div>
      <div class="caltrack" style="width:${days*cellW}px;${trackBg}">${bars}</div>
    </div>`;
  });

  return `<div class="calnav">
      <button class="btn sm" onclick="shiftCal(-14)">‹ 前兩週</button>
      <button class="btn sm" onclick="calToday()">回今天</button>
      <button class="btn sm" onclick="shiftCal(14)">後兩週 ›</button>
      <span>${cols[0].ds} ~ ${cols[days-1].ds}</span>
      <span class="callegend"><i class="lg appr"></i>已核准　<i class="lg pend"></i>待審核</span>
    </div>
    <div class="calwrap"><div class="calgrid">
      <div class="calrow calheadrow">${head}</div>${rows||'<div class="empty">沒有器材</div>'}
    </div></div>`;
}

// ---- 購物車 ----
function saveCart(){if(editMode)return;localStorage.setItem('gear_cart',JSON.stringify(cart));}  // 調整模式中的暫用清單不落地，不會污染真正的購物車
function reconcileCart(){  // 重整後對照最新庫存，移除已下架、修正超量
  let changed=false;
  Object.keys(cart).forEach(id=>{
    const eq=DATA.equipment.find(e=>e.id===id);
    if(!eq||eq['狀態']!=='可借用'){delete cart[id];changed=true;return;}
    const stock=Number(eq['數量'])||1;
    cart[id].名稱=eq['名稱']; cart[id].stock=stock;
    if(cart[id].數量>stock){cart[id].數量=stock;changed=true;}
  });
  if(changed) saveCart();
}
function addCart(id){
  const eq=DATA.equipment.find(e=>e.id===id); if(!eq) return;
  const stock=Number(eq['數量'])||1;
  if(!cart[id]) cart[id]={id,名稱:eq['名稱'],數量:1,stock};
  else if(cart[id].數量<stock) cart[id].數量++;
  else return toast('已達庫存上限','err');
  saveCart(); render(); toast('已加入清單','ok');
}
function setQty(id,d){
  if(!cart[id]) return;
  cart[id].數量+=d;
  if(cart[id].數量<=0) delete cart[id];
  else if(cart[id].數量>cart[id].stock) cart[id].數量=cart[id].stock;
  saveCart(); renderCart(); updateCart();
}
function removeCart(id){delete cart[id];saveCart();renderCart();updateCart();render();}
function cartQtyTotal(){return Object.values(cart).reduce((s,c)=>s+c.數量,0);}
function updateCart(){
  const fab=document.getElementById('cartFab');
  const n=Object.keys(cart).length;
  document.getElementById('cartCount').textContent=cartQtyTotal();
  fab.classList.toggle('hide',n===0||VIEW!=='inventory');
}
function openCart(){
  if(!Object.keys(cart).length) return toast('清單是空的','err');
  const sd=document.getElementById('ckStartDate'), st=document.getElementById('ckStartTime');
  const edd=document.getElementById('ckEndDate'), et=document.getElementById('ckEndTime');
  const nameEl=document.getElementById('ckName'), deptEl=document.getElementById('ckDept'),
        mailEl=document.getElementById('ckMail'), purEl=document.getElementById('ckPurpose'),
        locEl=document.getElementById('ckLocation');
  const idFields=[nameEl,deptEl,mailEl,purEl,locEl];
  if(editMode){
    document.getElementById('ckTitle').textContent='調整借用需求';
    document.getElementById('ckSub').textContent='瀏覽庫存調整器材與時間，送出後這個專案會整個退回待審核';
    document.getElementById('ckSubmit').textContent='儲存並重新送審';
    document.getElementById('ckExitEdit').classList.remove('hide');
    const sp=String(editMode.借出日).split(' '), ep=String(editMode.歸還日).split(' ');
    sd.value=sp[0]||''; st.value=sp[1]||'09:00';
    edd.value=ep[0]||''; et.value=ep[1]||'18:00';
    nameEl.value=editMode.借用人||''; deptEl.value=editMode.部門||'';
    mailEl.value=editMode.聯絡方式||''; purEl.value=editMode.用途||'';
    locEl.value=editMode.使用地點||'';
    idFields.forEach(el=>el.disabled=true);
  }else{
    document.getElementById('ckTitle').textContent='借用清單';
    document.getElementById('ckSub').textContent='選好器材與數量，最後填一次借用資料送出';
    document.getElementById('ckSubmit').textContent='送出申請';
    document.getElementById('ckExitEdit').classList.add('hide');
    idFields.forEach(el=>el.disabled=false);
    if(!sd.value){sd.value=todayStr();st.value='09:00';}
    // 自動帶入本機記住的上次借用資料
    const me=JSON.parse(localStorage.getItem('gear_borrower')||'{}');
    const pf=(el,v)=>{ if(v&&!el.value) el.value=v; };
    pf(nameEl,me.name); pf(deptEl,me.dept); pf(mailEl,me.mail);
  }
  renderCart(); openModal('cartModal');
}
function exitEditMode(){
  if(!confirm('放棄這次調整？尚未儲存的變更會遺失（你原本的借用清單不受影響）。')) return;
  editMode=null; cart=savedCart||{}; savedCart=null;
  closeModal('cartModal'); updateCart(); render();
}
function cartItemRow(c){
  const e=DATA.equipment.find(x=>x.id===c.id);
  const acc=e?accList(e['附帶']):[];
  return `<div class="citem">
    <div class="citemtop">
      <div class="cn">${c.名稱}${acc.length?` <span class="accbadge">📋 ${acc.length}</span>`:''}<div class="meta">庫存 ${c.stock}</div></div>
      <div class="step">
        <button onclick="setQty('${c.id}',-1)">−</button>
        <span class="qv">${c.數量}</span>
        <button onclick="setQty('${c.id}',1)" ${c.數量>=c.stock?'disabled':''}>+</button>
      </div>
      <button class="rm" onclick="removeCart('${c.id}')">✕</button>
    </div>
    ${acc.length?`<div class="acclist">${acc.map(it=>`<label class="accitem"><input type="checkbox" checked>${it}</label>`).join('')}</div>`:''}
  </div>`;
}
function removeBundleFromCart(bid){
  Object.keys(cart).forEach(id=>{if(cart[id].fromBundle===bid) delete cart[id];});
  saveCart(); renderCart(); updateCart(); render();
}
function toggleCartBundle(bid){cartBundleExpanded[bid]=!cartBundleExpanded[bid];renderCart();}
function renderCart(){
  const el=document.getElementById('cartItems');
  const items=Object.values(cart);
  if(!items.length){el.innerHTML=`<div class="empty" style="padding:20px">清單是空的</div>`;return;}
  const bundleGroups={}, standalone=[];
  items.forEach(c=>{
    if(c.fromBundle){(bundleGroups[c.fromBundle]=bundleGroups[c.fromBundle]||{name:c.bundleName,items:[]}).items.push(c);}
    else standalone.push(c);
  });
  let html='';
  Object.keys(bundleGroups).forEach(bid=>{
    const g=bundleGroups[bid], open=cartBundleExpanded[bid];
    const totalQty=g.items.reduce((s,c)=>s+c.數量,0);
    html+=`<div class="citem cbundle">
      <div class="citemtop">
        <span class="caret ${open?'open':''}" onclick="toggleCartBundle('${bid}')">▶</span>
        <div class="cn" onclick="toggleCartBundle('${bid}')" style="cursor:pointer">🎁 ${g.name}<div class="meta">${g.items.length} 項器材 · 共 ${totalQty} 件</div></div>
        <button class="rm" onclick="removeBundleFromCart('${bid}')">✕</button>
      </div>
      ${open?`<div class="cbundleitems">${g.items.map(cartItemRow).join('')}</div>`:''}
    </div>`;
  });
  html+=standalone.map(cartItemRow).join('');
  el.innerHTML=html;
}

document.getElementById('ckSubmit').onclick=async()=>{
  const items=Object.values(cart).map(c=>({器材id:c.id,數量:c.數量}));
  const sd=document.getElementById('ckStartDate').value, st=document.getElementById('ckStartTime').value;
  const ed=document.getElementById('ckEndDate').value, et=document.getElementById('ckEndTime').value;
  const s=sd&&st?`${sd} ${st}`:'', e2=ed&&et?`${ed} ${et}`:'';
  if(!s||!e2) return toast('請填寫完整時間','err');
  if(e2<=s) return toast('歸還時間需晚於借出時間','err');

  if(editMode){
    if(!items.length && !confirm('清單是空的，儲存後這個專案會被整個取消，確定？')) return;
    toast('更新中…');
    const r=await api('edit_project',{oldIds:editMode.oldIds,items,借出日:s,歸還日:e2},true);
    if(r.ok){
      editMode=null; cart=savedCart||{}; savedCart=null; saveCart();
      closeModal('cartModal'); toast('已更新，重新進入待審核','ok'); load();
    } else toast(r.error||'失敗','err');
    return;
  }

  if(!items.length) return toast('清單是空的','err');
  const p={
    items, 借出日:s, 歸還日:e2,
    借用人:document.getElementById('ckName').value.trim(),
    部門:document.getElementById('ckDept').value.trim(),
    聯絡方式:document.getElementById('ckMail').value.trim(),
    用途:document.getElementById('ckPurpose').value.trim(),
    使用地點:document.getElementById('ckLocation').value.trim(),
  };
  if(!p.借用人||!p.部門||!p.使用地點) return toast('請填寫必填欄位','err');
  if(!p.聯絡方式||p.聯絡方式.indexOf('@')<0) return toast('請填寫有效 Email','err');
  toast('送出中…');
  const r=await api('create_reservations',p,true);
  if(r.ok){
    localStorage.setItem('gear_borrower',JSON.stringify({name:p.借用人,dept:p.部門,mail:p.聯絡方式}));
    cart={}; saveCart(); closeModal('cartModal'); toast(`已送出 ${r.count} 項申請，等待審核`,'ok'); load();
  }
  else toast(r.error||'送出失敗','err');
};

async function cancelResv(id){ if(!confirm('確定取消？'))return; const r=await api('cancel_reservation',{id},true); r.ok?(toast('已取消','ok'),load()):toast(r.error,'err'); }

// ---- 調整已送出的專案（申請人自己或管理員都可用）----
function openEditProject(idx,scope){
  const arr=scope==='ad'?adGroups:myGroups;
  const g=arr[idx]; if(!g) return;
  const liveItems=g.items.filter(i=>['待審核','已核准'].includes(i['狀態']));
  if(!liveItems.length) return toast('這個專案沒有可調整的項目','err');
  savedCart=cart; // 暫存目前真正待送出的借用清單，調整期間完全不受影響
  cart={};
  liveItems.forEach(i=>{
    const eq=DATA.equipment.find(x=>x.id===i['器材id']);
    cart[i['器材id']]={id:i['器材id'],名稱:i['器材名稱'],數量:Number(i['數量'])||1,stock:eq?Number(eq['數量'])||1:99};
  });
  editMode={oldIds:liveItems.map(i=>i.id),借用人:g['借用人'],部門:g['部門'],聯絡方式:g['聯絡方式'],用途:g['用途']||'',使用地點:liveItems[0]['使用地點']||'',借出日:liveItems[0]['借出日'],歸還日:liveItems[0]['歸還日']};
  VIEW='inventory'; render();
  toast('已載入這個專案的器材，逛庫存調整後點右下角清單結帳','ok');
  openCart();
}

document.getElementById('pinSubmit').onclick=()=>{const v=document.getElementById('pinInput').value.trim();if(!v)return;ADMIN_PIN=v;sessionStorage.setItem('gear_pin',v);closeModal('pinModal');render();};
async function doReview(ids,decision,note){
  if(!ids.length) return;
  toast(decision==='approve'?'核准中…':'處理中…');
  const r=await api('review_batch',{ids,decision,pin:ADMIN_PIN,審核備註:note||''},true);
  if(r.ok){
    const f=(r.failed&&r.failed.length)?`，${r.failed.length} 項不足未過`:'';
    toast((decision==='approve'?`已核准 ${r.done} 項`:`已拒絕 ${r.done} 項`)+f, r.failed&&r.failed.length?'err':'ok');
  } else toast(r.error||'失敗','err');
  load();
}
function approveAll(idx){
  const g=adGroups[idx]; if(!g) return;
  const ids=grpPending(g).map(i=>i.id); if(!ids.length) return;
  if(!confirm(`全部批准「${g['用途']||grpBorrower(g)}」的 ${ids.length} 項？`)) return;
  doReview(ids,'approve');
}
function rejectAll(idx){
  const g=adGroups[idx]; if(!g) return;
  const ids=grpPending(g).map(i=>i.id); if(!ids.length) return;
  const note=prompt(`全部拒絕「${g['用途']||grpBorrower(g)}」的 ${ids.length} 項，原因（可留空）：`);
  if(note===null) return;
  doReview(ids,'reject',note);
}
function reviewSelected(idx,decision){
  const ids=[...document.querySelectorAll('.chk_ad_'+idx+':checked')].filter(b=>b.dataset.st==='待審核').map(b=>b.dataset.id);
  if(!ids.length) return toast('沒有勾選待審核的項目','err');
  if(decision==='reject'){const note=prompt(`拒絕勾選的 ${ids.length} 項，原因（可留空）：`); if(note===null) return; return doReview(ids,'reject',note);}
  if(!confirm(`批准勾選的 ${ids.length} 項？`)) return;
  doReview(ids,'approve');
}
function returnAll(idx){
  const g=adGroups[idx]; if(!g) return;
  const ids=g.items.filter(i=>i['狀態']==='已核准').map(i=>i.id); if(!ids.length) return;
  if(!confirm(`全部歸還「${g['用途']||grpBorrower(g)}」的 ${ids.length} 項？`)) return;
  doReturn(ids);
}
function returnSelected(idx){
  const ids=[...document.querySelectorAll('.chk_ad_'+idx+':checked')].filter(b=>b.dataset.st==='已核准').map(b=>b.dataset.id);
  if(!ids.length) return toast('沒有勾選已核准（借出中）的項目','err');
  if(!confirm(`登記歸還勾選的 ${ids.length} 項？`)) return;
  doReturn(ids);
}
async function doReturn(ids){
  if(!ids.length) return;
  toast('登記歸還中…');
  const r=await api('return_batch',{ids,pin:ADMIN_PIN},true);
  r.ok?(toast(`已歸還 ${r.done} 項`,'ok'),load()):toast(r.error||'失敗','err');
}
async function markReturn(id){if(!confirm('確認此器材已歸還？'))return;const r=await api('return',{id,pin:ADMIN_PIN},true);r.ok?(toast('已登記歸還','ok'),load()):toast(r.error,'err');}

// ---- 照片上傳（自動壓縮成內嵌縮圖）----
function updatePhotoPreview(){
  const v=document.getElementById('emPhoto').value.trim();
  const p=document.getElementById('emPhotoPrev'), h=document.getElementById('emPhotoHint');
  if(v){p.src=v;p.classList.remove('hide');h.classList.add('hide');}
  else{p.classList.add('hide');h.classList.remove('hide');}
}
function clearPhoto(){document.getElementById('emPhoto').value='';document.getElementById('emFile').value='';updatePhotoPreview();}
function processImage(file){
  if(!file||!file.type.startsWith('image/')) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const shrink=(max,q)=>{let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);return cv.toDataURL('image/jpeg',q);};
      let uri=shrink(320,0.72), q=0.72;
      while(uri.length>45000&&q>0.35){q-=0.1;uri=shrink(320,q);}
      if(uri.length>45000) uri=shrink(240,0.6);
      document.getElementById('emPhoto').value=uri;
      updatePhotoPreview();
      toast('圖片已載入','ok');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function openEquip(id){
  editEquipId=id;
  const e=id?DATA.equipment.find(x=>x.id===id):{};
  // 填入既有分類/群組供下拉選單，也可直接輸入新的
  const uniq=k=>[...new Set(DATA.equipment.map(x=>x[k]).filter(Boolean))].sort();
  document.getElementById('catList').innerHTML=uniq('分類').map(c=>`<option value="${c}">`).join('');
  document.getElementById('grpList').innerHTML=uniq('群組').map(g=>`<option value="${g}">`).join('');
  document.getElementById('emTitle').textContent=id?'編輯器材':'新增器材';
  const g=(k,v)=>document.getElementById(k).value=e[v]||'';
  g('emName','名稱');g('emCat','分類');g('emModel','型號');g('emSerial','序號');g('emPhoto','照片網址');g('emNote','備註');g('emGroup','群組');g('emAcc','附帶');
  document.getElementById('emQty').value=Number(e['數量'])||1;
  document.getElementById('emStatus').value=e['狀態']||'可借用';
  document.getElementById('emDelete').style.display=id?'block':'none';
  document.getElementById('emFile').value='';
  updatePhotoPreview();
  openModal('equipModal');
}
document.getElementById('emSave').onclick=async()=>{
  const p={pin:ADMIN_PIN,
    名稱:document.getElementById('emName').value.trim(),分類:document.getElementById('emCat').value.trim(),
    型號:document.getElementById('emModel').value.trim(),序號:document.getElementById('emSerial').value.trim(),
    狀態:document.getElementById('emStatus').value,照片網址:document.getElementById('emPhoto').value.trim(),
    備註:document.getElementById('emNote').value.trim(),群組:document.getElementById('emGroup').value.trim(),
    附帶:document.getElementById('emAcc').value.trim(),
    數量:Number(document.getElementById('emQty').value)||1};
  if(!p.名稱) return toast('請填寫名稱','err');
  const r=editEquipId?await api('update_equipment',{id:editEquipId,...p},true):await api('add_equipment',p,true);
  r.ok?(closeModal('equipModal'),toast('已儲存','ok'),load()):toast(r.error,'err');
};
document.getElementById('emDelete').onclick=async()=>{if(!confirm('確定刪除？'))return;const r=await api('delete_equipment',{id:editEquipId,pin:ADMIN_PIN},true);r.ok?(closeModal('equipModal'),toast('已刪除','ok'),load()):toast(r.error,'err');};

// ---- 組合包編輯（管理端）----
function openBundle(id){
  editBundleId=id;
  const b=id?(DATA.bundles||[]).find(x=>x.id===id):null;
  document.getElementById('bmTitle').textContent=id?'編輯組合':'新增組合';
  document.getElementById('bmName').value=b?b['名稱']||'':'';
  document.getElementById('bmDesc').value=b?b['說明']||'':'';
  document.getElementById('bmStatus').value=b?(b['狀態']||'啟用'):'啟用';
  document.getElementById('bmDelete').style.display=id?'block':'none';
  bundleSel={};
  if(b){let items=[];try{items=JSON.parse(b['項目']||'[]');}catch(e){}items.forEach(it=>bundleSel[it['器材id']]=Number(it['數量'])||1);}
  renderBundlePickList();
  openModal('bundleModal');
}
function renderBundlePickList(){
  const cats=[...new Set(DATA.equipment.map(e=>e['分類']).filter(Boolean))];
  let html='';
  cats.forEach(cat=>{
    const items=DATA.equipment.filter(e=>e['分類']===cat);
    if(!items.length) return;
    html+=`<div class="bmgrouphead">${catStyle(cat).e} ${cat}</div>`;
    items.forEach(e=>{
      const checked=bundleSel[e.id]!=null;
      html+=`<div class="bmrow">
        <label><input type="checkbox" data-id="${e.id}" ${checked?'checked':''} onchange="bmToggle('${e.id}',this.checked)">${e['名稱']}</label>
        <input type="number" min="1" value="${checked?bundleSel[e.id]:1}" data-qty="${e.id}" oninput="bmQty('${e.id}',this.value)" ${checked?'':'disabled'}>
      </div>`;
    });
  });
  document.getElementById('bmPickList').innerHTML=html||'<div class="empty" style="padding:16px">尚無器材</div>';
}
function bmToggle(id,checked){
  if(checked) bundleSel[id]=bundleSel[id]||1; else delete bundleSel[id];
  const qtyInput=document.querySelector(`[data-qty="${id}"]`); if(qtyInput) qtyInput.disabled=!checked;
}
function bmQty(id,v){if(bundleSel[id]!=null) bundleSel[id]=Math.max(1,Number(v)||1);}
document.getElementById('bmSave').onclick=async()=>{
  const name=document.getElementById('bmName').value.trim();
  if(!name) return toast('請填寫名稱','err');
  const items=Object.keys(bundleSel).map(id=>({器材id:id,數量:bundleSel[id]}));
  if(!items.length) return toast('請至少勾選一項器材','err');
  const p={pin:ADMIN_PIN,名稱:name,說明:document.getElementById('bmDesc').value.trim(),
    狀態:document.getElementById('bmStatus').value,項目:JSON.stringify(items)};
  const r=editBundleId?await api('update_bundle',{id:editBundleId,...p},true):await api('add_bundle',p,true);
  r.ok?(closeModal('bundleModal'),toast('已儲存','ok'),load()):toast(r.error,'err');
};
document.getElementById('bmDelete').onclick=async()=>{
  if(!confirm('確定刪除此組合？'))return;
  const r=await api('delete_bundle',{id:editBundleId,pin:ADMIN_PIN},true);
  r.ok?(closeModal('bundleModal'),toast('已刪除','ok'),load()):toast(r.error,'err');
};

// ---- 共用 ----
function openModal(id){document.getElementById(id).classList.add('on');}
function closeModal(id){document.getElementById(id).classList.remove('on');}
let toastT;
function toast(m,t=''){const el=document.getElementById('toast');el.textContent=m;el.className='toast on '+t;clearTimeout(toastT);toastT=setTimeout(()=>el.className='toast',2600);}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('on');}));
document.getElementById('emPhotoZone').addEventListener('click',()=>document.getElementById('emFile').click());
document.getElementById('emFile').addEventListener('change',e=>{if(e.target.files[0])processImage(e.target.files[0]);});
document.addEventListener('paste',e=>{
  if(!document.getElementById('equipModal').classList.contains('on'))return;
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(const it of items){if(it.type&&it.type.startsWith('image/')){const f=it.getAsFile();if(f){processImage(f);e.preventDefault();}break;}}
});
document.getElementById('tabs').addEventListener('click',e=>{if(e.target.dataset.view){VIEW=e.target.dataset.view;render();}});

load();
</script>
